name: Build, Test and Deploy   # GitHub, 2026a

on:
  push:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build CoffeeNChill.slnx --configuration Release

      - name: Run unit tests   # Microsoft, 2026ad
        run: dotnet test CoffeeNChill.slnx --configuration Release --no-build

  docker:
    needs: build-and-test
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}    # GitHub, 2026c
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to Docker Hub   # GitHub, 2026b
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ vars.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push the images   # Docker Inc., 2026a
        run: |
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-functions:v3.0 ./CoffeeNChillExample
          docker build -t ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-gateway:v3.0 ./CoffeeNChillGatewayAPI
          docker push ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-functions:v3.0
          docker push ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-gateway:v3.0

  deploy:
    needs: docker
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Deploy to the VPS over SSH   # Microsoft, 2026al
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.VPS_HOST }} >> ~/.ssh/known_hosts
          scp docker-compose.yml ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }}:~/coffeenchill/docker-compose.yml
          ssh ${{ vars.VPS_USER }}@${{ vars.VPS_HOST }} "cd ~/coffeenchill && docker compose pull && docker compose up -d"
