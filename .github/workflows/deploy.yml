name: Build, Test and Deploy   # GitHub, 2026a

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_VERSION: '10.0.x'
  RELEASE_TAG: v3.0
  BUILD_TAG: v3.0.${{ github.run_number }}

jobs:
  build-and-test:
    name: Build and run unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore CoffeeNChill.slnx

      - name: Build
        run: dotnet build CoffeeNChill.slnx --configuration Release --no-restore

      - name: Run unit tests   # Microsoft, 2026ae
        run: dotnet test CoffeeNChill.slnx --configuration Release --no-build --verbosity normal

  docker:
    name: Build and push Docker Hub images
    needs: build-and-test
    if: ${{ vars.DOCKERHUB_USERNAME != '' }}    # GitHub, 2026c
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx   # Docker Inc., 2026f
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}    # GitHub, 2026b

      - name: Build and push the Functions image
        uses: docker/build-push-action@v7
        with:
          context: ./CoffeeNChillExample
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-functions:${{ env.RELEASE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-functions:${{ env.BUILD_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-functions:latest

      - name: Build and push the Gateway API image
        uses: docker/build-push-action@v7
        with:
          context: ./CoffeeNChillGatewayAPI
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-gateway:${{ env.RELEASE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-gateway:${{ env.BUILD_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/coffeenchill-gateway:latest

  deploy:
    name: Deploy to the VPS
    needs: docker
    if: ${{ vars.VPS_HOST != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy docker-compose.yml to the VPS   # appleboy, 2026b
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ~/coffeenchill

      - name: Pull the new images and restart the stack   # appleboy, 2026a
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ vars.VPS_HOST }}
          username: ${{ vars.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ vars.VPS_PORT || 22 }}
          script: |
            cd ~/coffeenchill
            export IMAGE_TAG=${{ env.BUILD_TAG }}
            docker compose pull
            docker compose up -d
            docker image prune -f
