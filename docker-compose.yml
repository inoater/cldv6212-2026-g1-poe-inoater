services: # Docker Inc., 2026b; IIE, 2026g
  azurite:
    image: liyemamncoraemecpe/coffeenchill-azurite:v1.0
    command: ["azurite", "-l", "/data", "--blobHost", "0.0.0.0", "--queueHost", "0.0.0.0", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]
    container_name: coffeenchill-azurite
    restart: on-failure
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    networks:
      - coffeenchill_network

  functions:
    image: liyemamncoraemecpe/coffeenchill-functions:v2.0
    container_name: coffeenchill-functions
    restart: on-failure
    depends_on:
      - azurite
    ports:
      - "7071:80"
    environment:  # Docker Inc., 2026c
      - FUNCTIONS_WORKER_RUNTIME=dotnet-isolated
      - AzureWebJobsStorage=DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
    networks:
      - coffeenchill_network

volumes:
  azurite_data:
    driver: local

networks: # Docker Inc., 2026c
  coffeenchill_network:
    driver: bridge
